spring.application.name=backend-api

# H2 Database configuration (stored in volatile memory)
spring.datasource.url=jdbc:h2:mem:ecommercedb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Enable H2 web console to view data from the browser
spring.h2.console.enabled=true

# Tells Hibernate (Spring's database manager) to automatically create/update database tables
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true